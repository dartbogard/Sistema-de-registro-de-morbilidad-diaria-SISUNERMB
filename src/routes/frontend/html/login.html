<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--links de fuentes-->
    <link rel="stylesheet" href="../css/styles_login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <!--links de iconos-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person" />
    <title>Login Page</title>
</head>
<body>
    <!--Header de la pagina-->
    <nav class="nav-login">
            <img class="img-nav-login" src="../images/cintillo-unermb.png" alt="">
            <img class="img-nav-login" src="../images/sisunermb.png" alt="">
            <h1>BIENVENIDO AL REGISTRO MEDICO SISUNERMB</h1>
    </nav>
    <img class="img-background" src="../images/background.jpg" alt="">
    <!--Inicia Formulario-->
    <div class="div-form-login">
        
        <form action="/login" method="POST">
        <!--Pide Usuario-->
        <div class="div-inner-form-login">
            <label for="usuario">Usuario:</label>
            <div class="div-icon-wrapper">
                <span class="material-symbols-outlined icon-user">person</span>
                <input focus="true" placeholder="Ingrese su Usuaurio" type="text" id="usuario" name="username" required autocomplete="username">
            </div>
        </div>
        <!--Pide Contrasena-->
        <div class="div-inner-form-login">
            <label for="contrasena">Contraseña:</label>
            <input placeholder="Ingrese su Contraseña" type="password" id="contrasena" name="password" required autocomplete="current-password">
        </div>
        <!--Boton-->
        <div class="div-inner-form-login">
            <button type="submit">Iniciar Sesión</button>
        </div>
        </form>
    </div>
    <!--Termina el formulario-->
    <footer class="footer-login">
        <p>Creditos: Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor harum inventore suscipit fugit. Quasi reiciendis, voluptate neque facere debitis rem.</p>
    </footer>
</body>
</html>
