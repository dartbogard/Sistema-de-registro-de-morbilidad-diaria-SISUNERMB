<!DOCTYPE html>
<!--ARTURO, TE VOY A IR EXPLICANDO QUE VIENE HACIENDO MAS O MENOS CADA SECCION PARA QUE LO ENTIENDAS CUANDO
LLEGUES ANADIRLE LA LOGICA YA SEA CON RUST O JAVASCRIPT-->
<html lang="en">
<head>
    <!--ESTOS SON BASICAMENTE METADATOS Y DONDE SE VAN A RELACIONAR DISTINTOS ARCHIVOS, INCLUYENDO EL DE JS-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles_landing_page_user.css">
    <title>SISUNERMB</title>
</head>
<body>
    <!--BASICAMENTE ES UN PEQUENO NAVEGADOR PARA IR ENTRE LAS SECCIONES-->
    <nav>
        <a href="#div-gen-con"><li>Generar Consulta Medica</li></a>
        <a href="#div-est"><li>Ver Estadisticas</li></a>
        <a href="#div-ing-ben"><li>Ingresar Beneficiario</li></a>
        <a href="div-eli-ben"><li>Eliminar Beneficiario</li></a>
    </nav>
    <!--AQUI COMIENZA LO CHIDO-->
    <main>
        <!--VOY A SEPARAR CADA FUNCION DENTRO DE DIVS (DIVISOR), TE VAS A GUIAR PRINCIPALMENTE POR LOS QUE 
        TIENEN LA CLASS DIV-MAIN, ES MUY PROBABLE QUE TENGAS QUE TERMINAR ANADIENDO OTRAS ETIQUETAS O 
        EVENTOS/FUNCIONES PARA QUE LA LOGICA FUNCIONE BIEN, PERO NADA QUE GEMINI Y VOS (LA CABRA)
        NO PUEDA HACER.
        DICHO ESTO, ESTA PEQUENA SECCION LO QUE HACE ES INGRESAR LA CEDULA DEL BENEFICIARIO Y SER BUSCADO-->
        <div class="div-main" id="div-gen-con">
            <label for="cedula">Cédula del Beneficiario</label>
            <div class="search-box">
            <input type="text" id="cedula" placeholder="Ej: 12345678" autofocus>
            <button type="button" class="btn-primary" onclick="buscarBeneficiario()">Buscar</button>
            </div>
        

      <!-- ESTE ES EL RESULTADO DE LA CONSULTA, ME ENCANTARIA QUE ESTO QUEDE OCULTO Y CON LA AYUDA DE JS SALGA
       LOS RESULTADOS COMO UNA NUEVA SECCION. Ten en cuenta el nombre de las funciones cuando lo hagas en js,
        claramente puedes cambiarla tambien aca-->
      <form id="form-consulta" onsubmit="guardarConsulta(event)">
        <!---->
        <div class="form-group">
          <label for="nombre-completo">Nombre Completo del Beneficiario</label>
          <input type="text" id="nombre-completo" placeholder="Aparecerá automáticamente al buscar" disabled required>
        </div>
        <!--Esta parte de aca lo que hace basicamente es dar las opciones para que ingresen cierto tipos de datos,
         como la especialidad, el nombre del doctor etc
         que estan predefenidos en el front-end (tenemos que corregir eso, es para salir del paso), este en concreto
         es para la especialidad-->
        <div class="form-row">
          <div class="form-group">
            <label for="especialidad">Especialidad</label>
            <select id="especialidad" disabled required onchange="actualizarDoctores()">
              <option value="">Seleccione...</option>
              <option value="General">Medicina General</option>
              <option value="Pediatria">Pediatría</option>
              <option value="Cardiologia">Cardiología</option>
            </select>
          </div>
          <!--doctor-->
          <div class="form-group">
            <label for="doctor">Doctor</label>
            <select id="doctor" disabled required>
              <option value="">Seleccione especialidad primero...</option>
            </select>
          </div>
        </div>
        <!--Es para la fecha, esto lo puedes modificar para que lo haga en modo de una funcion-->
        <div class="form-group">
          <label for="fecha">Fecha Vigente</label>
          <input type="text" id="fecha" disabled>
        </div>

        <div class="form-group">
          <label for="diagnostico">Diagnóstico / Observación</label>
          <textarea id="diagnostico" rows="4" placeholder="Escriba los síntomas o el diagnóstico aquí..." disabled required></textarea>
        </div>

        <button type="submit" id="btn-guardar" class="btn-success" disabled>Registrar Consulta</button>
      </form>

      <div id="mensaje-exito" class="alert alert-success">¡Consulta registrada con éxito de manera local!</div>

 
        </div>
        <div class="div-main" id="div-est">

        </div>
        <div class="div-main" id="div-ing-ben">

        </div>
        <div class="div-main" id="div-eli-ben">

        </div>
    </main>

    <footer>

    </footer>
</body>
</html>
